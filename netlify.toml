# The old netlify.app address (http and https) moves permanently to the custom domain.
# Netlify already sends http and www on strong-courageous.co.za to https://strong-courageous.co.za.
[[redirects]]
  from = "https://n0basen0season.netlify.app/*"
  to = "https://strong-courageous.co.za/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://n0basen0season.netlify.app/*"
  to = "https://strong-courageous.co.za/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# Fonts never change; photos rarely do.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Calendar invites (linked from the site and the sign up confirmation email).
[[headers]]
  for = "/calendar/*"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Cache-Control = "public, max-age=3600"
